name: Linear traceability

on:
  workflow_call:
    inputs:
      policy_ref:
        description: Immutable commit of this policy repository, matching the caller's reusable-workflow pin.
        required: true
        type: string
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Linear contract
    runs-on: ubuntu-latest
    steps:
      - name: Verify reusable-workflow identity
        if: inputs.policy_ref != ''
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$POLICY_REF" = "$WORKFLOW_SHA"
      - name: Check out policy repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kristoffersodersten/.github
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: scripts/validate-linear-traceability.sh
      - name: Test conforming and non-conforming fixtures
        run: scripts/test-linear-traceability.sh
